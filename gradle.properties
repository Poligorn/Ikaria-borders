org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# Target/test server version; compatible with 21.1.252
neo_version=21.1.250
# Minimum NeoForge accepted at runtime
neo_version_range=[21.1.219,)
loader_version_range=[1,)

mod_id=ikaria_borders
mod_name=Ikaria Borders
mod_license=MIT
mod_version=0.4.0
mod_group_id=com.poligorn.ikariaborders

# Open Parties and Claims jar for compileOnly (soft dependency; the jar is never committed or shipped).
# Default: ../ikaria-zones/mod-libs/open-parties-and-claims-neoforge-1.21.1-0.32.7.jar relative to the repo.
# Override: ./gradlew build -Popac_jar=/abs/path/to/open-parties-and-claims-neoforge-1.21.1-0.32.7.jar
#opac_jar=

# KubeJS 2101.7.2 and its Rhino for compileOnly (soft dependency; jars are never committed or shipped).
# Default: ../ikaria-zones/mod-libs/ relative to the repo.
# Override: ./gradlew build -Pkubejs_jar=/abs/kubejs-neoforge-2101.7.2-build.368.jar -Prhino_jar=/abs/rhino-2101.2.7-build.85.jar
#kubejs_jar=
#rhino_jar=

# Xaero's World Map 1.47.0 and Minimap 26.6.0 for compileOnly (soft client dependencies; jars are never committed or shipped).
# Default: ../ikaria-zones/mod-libs/ relative to the repo.
# Override: ./gradlew build -Pxaero_worldmap_jar=/abs/xaeroworldmap-neoforge-1.21.1-1.47.0.jar -Pxaero_minimap_jar=/abs/xaerominimap-neoforge-1.21.1-26.6.0.jar
#xaero_worldmap_jar=
