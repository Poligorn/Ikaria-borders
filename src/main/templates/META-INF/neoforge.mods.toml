modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Poligorn/Ikaria-borders/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Poligorn/Ikaria-borders"
authors="Poligorn"
description='''
Зоны и границы для сервера MC-Ikaria: формы, приоритеты, наследование правил, API для скриптов.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional: without OPAC there is no claim ban and no sweep; everything else works.
[[dependencies.${mod_id}]]
    modId="openpartiesandclaims"
    type="optional"
    ordering="AFTER"
    side="BOTH"

# Optional: without KubeJS there are no script events or the IkariaBorders binding; zone rules work as usual.
[[dependencies.${mod_id}]]
    modId="kubejs"
    type="optional"
    ordering="AFTER"
    side="BOTH"
